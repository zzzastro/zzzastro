name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Crop the SVG to remove bottom progress bar area
      - name: crop bottom area
        run: |
          # Change viewBox height from default to cropped version
          sed -i 's/viewBox="0 0 \([0-9]*\) [0-9]*"/viewBox="0 0 \1 100"/' dist/github-contribution-grid-snake.svg
          sed -i 's/viewBox="0 0 \([0-9]*\) [0-9]*"/viewBox="0 0 \1 100"/' dist/github-contribution-grid-snake-dark.svg
          
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}